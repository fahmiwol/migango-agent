<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" role="img" aria-label="Blended cost per 1M tokens (input + output + cache)">

<style>
  .root { --surface:#fcfcfb; --t1:#0b0b0b; --t2:#52514e; --t3:#8a8984; --grid:#e6e5e0;
          --cloud:#2a78d6; --local:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    .root { --surface:#1a1a19; --t1:#f0efec; --t2:#c3c2b7; --t3:#8f8e86; --grid:#33332f;
            --cloud:#3987e5; --local:#199e70; }
  }
  .bg { fill: var(--surface); }
  .title { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--t1); }
  .sub { font: 400 11.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--t2); }
  .lab { font: 500 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--t1); }
  .val { font: 600 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: var(--t1); }
  .note { font: 400 10.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--t3); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .cloud { fill: var(--cloud); }
  .local { fill: var(--local); }
  .key { font: 500 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: var(--t2); }
</style>

<g class="root">
<rect class="bg" x="0" y="0" width="720" height="370" rx="10"/>
<text class="title" x="20" y="30">Blended cost per 1M tokens (input + output + cache)</text>
<text class="sub" x="20" y="50">USD per 1M tokens actually billed, same log, 2026-10-26 to 2026-11-09 (6 logged days)</text>
